<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Sécurisée - Dashboard</title>
    <!-- Importation de la bibliothèque MQTT.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.5rem;
        }
        .status-badge {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
        }
        .status-badge.connected {
            background-color: #2ecc71;
        }
        .control-panel {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .btn.disarm {
            background-color: #e74c3c;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #34495e;
        }
        .state {
            font-size: 0.9rem;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            font-weight: bold;
            background-color: #2ecc71;
            color: white;
        }
        .state.alert {
            background-color: #e74c3c;
        }
        .history {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .history h3 {
            margin-top: 0;
            font-size: 1.1rem;
        }
        #logList {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
        }
        #logList li {
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <h1>🔒 MAISON SECURE</h1>
    <div id="connectionStatus" class="status-badge">Connexion au broker MQTT...</div>

    <!-- Panneau de commande interactif -->
    <div class="control-panel">
        <h3>Contrôle de l'Alarme</h3>
        <button class="btn" onclick="envoyerCommande('ARMER')">Activer l'Alarme</button>
        <button class="btn disarm" onclick="envoyerCommande('DESARMER')">Couper l'Alarme</button>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Entrée</h3>
            <div id="state-entree" class="state">Normal</div>
        </div>
        <div class="card">
            <h3>Salon</h3>
            <div id="state-salon" class="state">Normal</div>
        </div>
        <div class="card">
            <h3>Chambre</h3>
            <div id="state-chambre" class="state">Normal</div>
        </div>
        <div class="card">
            <h3>Couloir</h3>
            <div id="state-couloir" class="state">Normal</div>
        </div>
    </div>

    <div class="history">
        <h3>Historique des événements</h3>
        <ul id="logList">
            <li>En attente d'événements...</li>
        </ul>
    </div>

    <script>
        const brokerUrl = 'wss://test.mosquitto.org:8081/mqtt';
        const client = mqtt.connect(brokerUrl);

        const topics = {
            'nyantsa/maison/entree': 'state-entree',
            'nyantsa/maison/salon': 'state-salon',
            'nyantsa/maison/chambre': 'state-chambre',
            'nyantsa/maison/couloir': 'state-couloir'
        };

        client.on('connect', () => {
            const statusDiv = document.getElementById('connectionStatus');
            statusDiv.textContent = 'Système Connecté au Cloud MQTT';
            statusDiv.classList.add('connected');

            Object.keys(topics).forEach(topic => {
                client.subscribe(topic, (err) => {
                    if (!err) console.log(`Abonné à ${topic}`);
                });
            });
        });

        // Fonction pour envoyer des ordres à l'ESP32
        function envoyerCommande(action) {
            client.publish('nyantsa/maison/commande', action);
            console.log("Commande envoyée : " + action);
        }

        client.on('message', (topic, payload) => {
            const message = payload.toString();
            const elementId = topics[topic];
            
            if (elementId) {
                const badge = document.getElementById(elementId);
                const zoneName = badge.parentElement.querySelector('h3').textContent;
                const now = new Date().toLocaleTimeString();

                if (message.includes('ALERTE')) {
                    badge.textContent = 'Mouvement';
                    badge.classList.add('alert');
                } else {
                    badge.textContent = 'Normal';
                    badge.classList.remove('alert');
                }

                const logList = document.getElementById('logList');
                if (logList.children.length === 1 && logList.children[0].textContent.includes("En attente")) {
                    logList.innerHTML = '';
                }
                const li = document.createElement('li');
                li.textContent = `[${now}] ${zoneName} : ${message}`;
                logList.insertBefore(li, logList.firstChild);
            }
        });
    </script>

</body>
</html>
